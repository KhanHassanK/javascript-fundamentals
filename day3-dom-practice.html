<!-- Task 1 Form Validation -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 3 Tasks</title>
    <style>
      .error_message {
        color: red;
        margin-top: 10px;
      }
    </style>
  </head>

  <body>
    <!-- Create a regristration form with validation -->
    <h2>Registration Form</h2>
    <form id="registrationForm">
      <label for="username">Username:</label>
      <input type="text" id="username" name="username" required />
      <br />
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required />
      <br />
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required />
      <br />
      <label for="confirmPassword">Confirm Password:</label>
      <input
        type="password"
        id="confirmPassword"
        name="confirmPassword"
        required
      />
      <br />
      <button type="submit">Register</button>
    </form>
    <div id="errorMessage" class="error_message"></div>

    <script>
      // Validation requirements:
      // - Username: Must be at least 3 characters long.
      // - Email: Must contain @ and .
      // - Password: Minimum 6 characters
      // - Confirm Password:must match password
      // - Display error messages in the errorMessage div

      const form = document.getElementById("registrationForm");
      const userNameInput = document.getElementById("username");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const confirmPasswordInput = document.getElementById("confirmPassword");
      const errorMessageDiv = document.getElementById("errorMessage");
      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const username = userNameInput.value.trim();
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;
        errorMessageDiv.textContent = "";
        if (username.length < 3) {
          errorMessageDiv.textContent =
            "Username must be at least 3 characters long.";
          return;
        }
        if (!email.includes("@") || !email.includes(".")) {
          errorMessageDiv.textContent = 'Email must contain "@" and ".".';
          return;
        }
        if (password.length < 6) {
          errorMessageDiv.textContent =
            "Password must be at least 6 characters long.";
          return;
        }
        if (password !== confirmPassword) {
          errorMessageDiv.textContent = "Passwords do not match.";
          return;
        }
        errorMessageDiv.textContent = "Registration successful!";
        form.reset();
      });
    </script>
  </body>
</html>

<!-- Task 2 Toggle Button -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <style>
    .box {
      width: 200px;
      height: 200px;
      background: blue;
    }
    .box.active {
      background: red;
      transform: scale(1.2);
    }
    #toggleButton {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
  <body>
    <!-- Build a button that toggles a CSS class -->
    <h2>Toggle Box</h2>
    <div class="box" id="toggleBox"></div>
    <button id="toggleButton">Toggle Box</button>

    <script>
      // Toggle 'active' class on click
      const toggleButton = document.getElementById("toggleButton");
      const toggleBox = document.getElementById("toggleBox");
      toggleButton.addEventListener("click", function () {
        toggleBox.classList.toggle("active");
      });
    </script>
  </body>
</html>
